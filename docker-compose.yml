services:
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      AI_ENHANCE_SERVER_URL: http://ai-server:8001/enhance
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - ai-server

  ai-server:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    volumes:
      - ./ai-server:/app

volumes:
  frontend_node_modules:
