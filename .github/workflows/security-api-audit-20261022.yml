name: Verify Python API security patch
on:
  push:
    branches:
      - security/api-python-audit-20261022
    paths:
      - .github/workflows/security-api-audit-20261022.yml
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Upgrade supported server dependencies and freeze requirements
        working-directory: ai-server
        run: |
          uv add 'fastapi>=0.115.12,<1' 'uvicorn[standard]>=0.34.2,<1' 'python-multipart>=0.0.28,<1' 'pillow>=13.0.0,<14'
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file requirements.txt
      - name: Audit patched locked runtime packages
        working-directory: ai-server
        run: uv audit --frozen --no-dev
      - name: Verify HTTP processing with a local test image
        working-directory: ai-server
        run: |
          AI_PROCESSOR=local_dummy uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/api-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 5
          uv run python scripts/smoke_test_ai_server.py
      - name: Commit tested API patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-server/pyproject.toml ai-server/uv.lock ai-server/requirements.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Python API dependencies"
            git push origin HEAD:security/api-python-audit-20261022
          fi
