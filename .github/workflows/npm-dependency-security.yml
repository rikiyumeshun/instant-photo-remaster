name: npm dependency security
on:
  push:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-dependency-security.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-dependency-security.yml
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Fail on new production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report full development advisory inventory
        continue-on-error: true
        run: npm audit --audit-level=high
