name: Temporary security patch and verification
on:
  push:
    branches:
      - security/nextjs-20261022
    paths:
      - .github/workflows/security-patch-20261022.yml
permissions:
  contents: write
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate consistent secure npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@15.5.28 react@19.0.9 react-dom@19.0.9
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@15.5.28
          npm update sharp --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Validate patched versions
        run: |
          node -e "const p=require('./package-lock.json').packages; for(const [n,v] of Object.entries({next:'15.5.28',react:'19.0.9','react-dom':'19.0.9','eslint-config-next':'15.5.28'})){if(p['node_modules/'+n]?.version!==v)throw Error(n+' mismatch');console.log(n,p['node_modules/'+n].version)}"
      - name: Validate fixed Sharp version
        run: |
          node -e "const l=require('./package-lock.json').packages;const s=l['node_modules/sharp']?.version;if(!s || (+s.split('.')[1]<35) || (+s.split('.')[1]===35&&+s.split('.')[2]<5))throw Error('unsafe sharp '+s);console.log('sharp',s)"
      - name: Run lint
        run: npm run lint
      - name: Run production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commit validated package and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Next.js and React October 2026 advisories"
            git push origin HEAD:security/nextjs-20261022
          fi
