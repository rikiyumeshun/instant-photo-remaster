name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_AI_ENHANCE_ENDPOINT: "https://instant-photo-remaster-ai.onrender.com/enhance"
          NEXT_PUBLIC_STRIPE_PACK_10_URL: ${{ vars.STRIPE_PACK_10_URL }}
          NEXT_PUBLIC_STRIPE_PACK_30_URL: ${{ vars.STRIPE_PACK_30_URL }}
          NEXT_PUBLIC_STRIPE_PACK_100_URL: ${{ vars.STRIPE_PACK_100_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
